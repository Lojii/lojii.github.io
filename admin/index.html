<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Stars 管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #0f3460;
            --primary: #e94560;
            --text: #eee;
            --text-dim: #999;
            --success: #27ae60;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--accent);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
        }

        .tabs {
            display: flex;
            gap: 8px;
        }

        .tab {
            padding: 10px 20px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
        }

        .tab.active {
            background: var(--primary);
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-dim);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            background: var(--card);
            color: var(--text);
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-secondary {
            background: var(--accent);
            color: var(--text);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-danger {
            background: #c0392b;
            color: #fff;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
        }

        .form-title {
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-title .mode-badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            background: var(--primary);
        }

        .form-title .mode-badge.edit {
            background: var(--success);
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--accent);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .list-item-info {
            flex: 1;
            min-width: 0;
        }

        .list-item-name {
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .list-item-meta {
            font-size: 12px;
            color: var(--text-dim);
        }

        .list-item-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            background: var(--success);
            color: #fff;
            display: none;
            z-index: 1000;
        }

        .toast.error {
            background: #c0392b;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .progress-bar {
            height: 8px;
            background: var(--accent);
            border-radius: 4px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s;
        }

        .log {
            background: #0d0d1a;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .preview-link {
            color: var(--primary);
            text-decoration: none;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            background: var(--accent);
            margin-left: 8px;
        }

        .badge.archived {
            background: #7f8c8d;
        }

        .image-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .image-preview img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--accent);
        }

        .image-preview .remove-img {
            position: relative;
        }

        .image-preview .remove-img::after {
            content: '×';
            position: absolute;
            top: -6px;
            right: -6px;
            width: 18px;
            height: 18px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        /* 图片选择弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--card);
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--accent);
        }

        .modal-header h3 {
            font-size: 16px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-footer .selected-count {
            font-size: 13px;
            color: var(--text-dim);
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .image-grid-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
            background: var(--bg);
        }

        .image-grid-item:hover {
            transform: scale(1.02);
        }

        .image-grid-item.selected {
            border-color: var(--primary);
        }

        .image-grid-item.selected::after {
            content: '\2713';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            font-weight: bold;
        }

        .image-grid-item img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }

        .image-grid-item .img-label {
            font-size: 11px;
            color: var(--text-dim);
            padding: 4px 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .image-picker-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        .image-picker-empty {
            text-align: center;
            padding: 30px;
            color: var(--text-dim);
        }

        .readme-preview-container {
            border: 1px solid var(--accent);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 12px;
        }

        .readme-preview-label {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .readme-render-area {
            background: #fff;
            color: #333;
            padding: 20px;
            max-height: 400px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        .readme-render-area img {
            max-width: 100%;
        }

        /* 图片上传区域 */
        .upload-zone {
            display: block;
            border: 2px dashed var(--accent);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--card);
            user-select: none;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(233, 69, 96, 0.1);
        }

        .upload-zone p {
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .upload-zone .hint {
            font-size: 12px;
            color: var(--text-dim);
        }

        .upload-preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .upload-preview-item {
            position: relative;
            width: 100px;
            height: 75px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--accent);
        }

        .upload-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-preview-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .upload-preview-item .file-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 10px;
            padding: 2px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>⭐ GitHub Stars 管理</h1>
            <a href="/docs/" target="_blank" class="preview-link">预览博客 →</a>
        </header>
        <div class="tabs">
            <button class="tab active" data-tab="add">➕ 添加/编辑</button>
            <button class="tab" data-tab="list">📋 管理列表</button>
            <button class="tab" data-tab="batch">🔄 批量更新</button>
        </div>

        <!-- 添加/编辑收藏 -->
        <div class="panel active" id="panel-add">
            <div class="card">
                <div class="form-title">
                    <span id="formTitleText">添加新收藏</span>
                    <span class="mode-badge" id="modeBadge">新增模式</span>
                </div>
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>URL地址</label>
                    <div style="display:flex;gap:8px">
                        <input type="text" id="addUrl" placeholder="输入 GitHub 仓库或文章 URL">
                        <button class="btn btn-secondary" onclick="parseUrl()">解析</button>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>中文名称 *</label><input type="text" id="addName"></div>
                    <div class="form-group"><label>英文名称</label><input type="text" id="addNameEn"></div>
                </div>
                <div class="form-group"><label>简介 *</label><textarea id="addSummary" rows="2"></textarea></div>
                <div class="form-group"><label>详细描述</label><textarea id="addDescription" rows="4"></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>分类 *</label><select id="addCategory"></select></div>
                    <div class="form-group"><label>标签 (中英文逗号分隔)</label><input type="text" id="addTags"></div>
                </div>
                <div class="form-group">
                    <label>当前图片</label>
                    <div class="image-preview" id="currentImages"></div>
                </div>
                <div class="form-group">
                    <label>添加图片URL (每行一个)</label>
                    <div style="display:flex;gap:8px;margin-bottom:8px">
                        <button class="btn btn-secondary" onclick="openImagePicker()">从网页获取图片</button>
                    </div>
                    <textarea id="addImages" rows="3" placeholder="https://..."></textarea>
                </div>
                <div class="form-group">
                    <label>上传图片 (支持多选、拖拽)</label>
                    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('addFiles').click()"
                        ondragover="event.preventDefault(); this.classList.add('dragover')"
                        ondragleave="this.classList.remove('dragover')" ondrop="handleDrop(event)">
                        <p>📁 点击选择图片 或 拖拽图片到此处</p>
                        <span class="hint">支持 JPG、PNG、GIF、WebP，可多选</span>
                    </div>
                    <input type="file" id="addFiles" multiple accept="image/*" style="display:none"
                        onchange="onFilesSelected(this)">
                    <div class="upload-preview" id="uploadPreview"></div>
                </div>
                <div class="form-group"><label>个人备注</label><textarea id="addNotes" rows="2"></textarea></div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="addArchived">
                        <label for="addArchived" style="margin-bottom:0">归档（不在首页显示）</label>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="submitBtn" onclick="submitItem()">添加收藏</button>
                    <button class="btn btn-secondary" onclick="clearForm()">清空/取消</button>
                    <button class="btn btn-success" id="refetchBtn" style="display:none"
                        onclick="refetchContent()">重新抓取原文</button>
                </div>
            </div>
        </div>

        <!-- 管理列表 -->
        <div class="panel" id="panel-list">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">收藏列表 (<span id="totalCount">0</span>)</span>
                    <div style="display:flex;gap:12px;align-items:center">
                        <label style="font-size:13px;display:flex;align-items:center;gap:6px">
                            <input type="checkbox" id="showArchived" onchange="renderList()"> 显示归档
                        </label>
                        <input type="text" id="listSearch" placeholder="搜索..." style="width:200px;padding:8px">
                    </div>
                </div>
                <div id="listItems"></div>
            </div>
        </div>

        <!-- 批量更新 -->
        <div class="panel" id="panel-batch">
            <div class="card">
                <h3 style="margin-bottom:16px">批量更新 GitHub 信息</h3>
                <p style="color:var(--text-dim);margin-bottom:16px">自动获取所有 GitHub 仓库的最新 Stars、Forks、语言、更新时间等信息。</p>
                <button class="btn btn-primary" id="batchBtn" onclick="batchUpdate()">开始更新</button>
                <div id="batchProgress" style="display:none;margin-top:20px">
                    <div class="progress-bar">
                        <div class="progress-bar-fill" id="progressFill"></div>
                    </div>
                    <div id="progressText" style="font-size:13px;color:var(--text-dim)"></div>
                </div>
                <div id="batchLog" class="log" style="display:none;margin-top:16px"></div>
            </div>
        </div>
    </div>
    <!-- 图片选择弹窗 -->
    <div class="modal-overlay" id="imagePickerModal">
        <div class="modal">
            <div class="modal-header">
                <h3>选择图片</h3>
                <button class="modal-close" onclick="closeImagePicker()">&times;</button>
            </div>
            <div class="modal-body" id="imagePickerBody">
                <div class="image-picker-loading">正在获取网页图片...</div>
            </div>
            <div class="modal-footer">
                <span class="selected-count" id="selectedCount">已选择 0 张</span>
                <div style="display:flex;gap:8px">
                    <button class="btn btn-secondary" onclick="closeImagePicker()">取消</button>
                    <button class="btn btn-primary" onclick="confirmImagePicker()">确认选择</button>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
        let collections = { items: [] }, categories = { categories: [], tags: [] }, parsedData = null, editMode = false, editingItem = null, selectedFiles = [], allItemIds = [];
        let pickerSelectedUrls = new Set();

        // 文件选择回调
        function onFilesSelected(input) {
            const files = Array.from(input.files).filter(f => f.type.startsWith('image/'));
            if (files.length) {
                selectedFiles = [...selectedFiles, ...files];
                renderUploadPreview();
            }
            input.value = '';
        }

        // 拖拽放下回调
        function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            document.getElementById('uploadZone').classList.remove('dragover');

            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            if (files.length) {
                selectedFiles = [...selectedFiles, ...files];
                renderUploadPreview();
            }
        }

        // 移除文件
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            renderUploadPreview();
        }

        // 渲染上传预览
        function renderUploadPreview() {
            const preview = document.getElementById('uploadPreview');
            if (!selectedFiles.length) {
                preview.innerHTML = '';
                return;
            }

            preview.innerHTML = selectedFiles.map((file, i) => {
                const url = URL.createObjectURL(file);
                return `
          <div class="upload-preview-item">
            <img src="${url}" alt="${file.name}">
            <button class="remove-btn" onclick="removeFile(${i})">×</button>
            <div class="file-name">${file.name}</div>
          </div>
        `;
            }).join('');
        }

        async function init() {
            // 加载 ID 数组和分类
            [allItemIds, categories] = await Promise.all([
                fetch('/api/collections').then(r => r.json()),
                fetch('/api/categories').then(r => r.json())
            ]);

            // 并行加载所有项目详情（包括归档的）
            const items = await Promise.all(
                allItemIds.map(id =>
                    fetch(`/api/items/${id}`)
                        .then(r => r.json())
                        .catch(() => null)
                )
            );

            // 构建 collections 对象
            collections = {
                items: items.filter(i => i && !i.error)
            };

            renderCategories();
            renderList();
        }

        async function reloadCollections() {
            // 重新加载所有项目数据
            allItemIds = await fetch('/api/collections').then(r => r.json());
            const items = await Promise.all(
                allItemIds.map(id =>
                    fetch(`/api/items/${id}`)
                        .then(r => r.json())
                        .catch(() => null)
                )
            );
            collections = {
                items: items.filter(i => i && !i.error)
            };
        }

        function renderCategories() {
            const sel = document.getElementById('addCategory');
            sel.innerHTML = categories.categories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
        }

        function renderList() {
            const search = document.getElementById('listSearch').value.toLowerCase();
            const showArchived = document.getElementById('showArchived')?.checked || false;

            // 过滤：先按归档状态，再按搜索关键字
            let items = collections.items || [];
            if (!showArchived) {
                items = items.filter(i => !i.archived);
            }
            if (search) {
                items = items.filter(i => i.name.toLowerCase().includes(search) || i.tags?.some(t => t.includes(search)));
            }

            document.getElementById('totalCount').textContent = items.length;
            document.getElementById('listItems').innerHTML = items.length ? items.map(i => `
        <div class="list-item" style="${i.archived ? 'opacity:0.6' : ''}">
          <div class="list-item-info">
            <div class="list-item-name">${i.name} ${i.archived ? '<span class="badge archived">已归档</span>' : ''}</div>
            <div class="list-item-meta">⭐${i.github?.stars || 0} · ${i.category} · ${i.tags?.slice(0, 3).join(', ') || '无标签'}</div>
          </div>
          <div class="list-item-actions">
            <button class="btn btn-success btn-sm" onclick="editItem('${i.id}')">编辑</button>
            <button class="btn btn-secondary btn-sm" onclick="toggleArchive('${i.id}', ${!i.archived})">${i.archived ? '取消归档' : '归档'}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteItem('${i.id}')">删除</button>
          </div>
        </div>
      `).join('') : '<p style="color:var(--text-dim);text-align:center;padding:40px">暂无数据</p>';
        }

        async function editItem(id) {
            try {
                showToast('加载中...');
                const item = await fetch(`/api/items/${id}`).then(r => r.json());
                if (item.error) throw new Error(item.error);

                editMode = true;
                editingItem = item;
                selectedFiles = []; // 清空已选择的文件
                document.getElementById('editId').value = id;
                document.getElementById('addUrl').value = item.url || '';
                document.getElementById('addName').value = item.name || '';
                document.getElementById('addNameEn').value = item.nameEn || '';
                document.getElementById('addSummary').value = item.summary || '';
                document.getElementById('addDescription').value = item.description || '';
                document.getElementById('addCategory').value = item.category || '';
                document.getElementById('addTags').value = (item.tags || []).join(', ');
                document.getElementById('addNotes').value = item.notes || '';
                document.getElementById('addArchived').checked = item.archived || false;
                document.getElementById('addImages').value = '';
                document.getElementById('addFiles').value = '';
                document.getElementById('uploadPreview').innerHTML = ''; // 清空上传预览

                // 显示当前图片
                const imgPreview = document.getElementById('currentImages');
                imgPreview.innerHTML = (item.images || []).map((src, i) =>
                    `<div class="remove-img" onclick="removeImage(${i})"><img src="${src}" alt="图片${i + 1}"></div>`
                ).join('') || '<span style="color:var(--text-dim);font-size:13px">暂无图片</span>';

                // 更新UI状态
                document.getElementById('formTitleText').textContent = `编辑: ${item.name}`;
                document.getElementById('modeBadge').textContent = '编辑模式';
                document.getElementById('modeBadge').classList.add('edit');
                document.getElementById('submitBtn').textContent = '保存修改';
                document.getElementById('refetchBtn').style.display = 'inline-block';

                // 切换到添加/编辑面板
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.querySelector('[data-tab="add"]').classList.add('active');
                document.getElementById('panel-add').classList.add('active');

                showToast('已加载，可以编辑');
            } catch (e) { showToast(e.message, true); }
        }

        function removeImage(index) {
            if (!editingItem || !confirm('确定移除这张图片吗？')) return;
            editingItem.images.splice(index, 1);
            const imgPreview = document.getElementById('currentImages');
            imgPreview.innerHTML = editingItem.images.map((src, i) =>
                `<div class="remove-img" onclick="removeImage(${i})"><img src="${src}" alt="图片${i + 1}"></div>`
            ).join('') || '<span style="color:var(--text-dim);font-size:13px">暂无图片</span>';
        }

        async function parseUrl() {
            const url = document.getElementById('addUrl').value.trim();
            if (!url) return showToast('请输入 URL', true);
            try {
                showToast('正在解析...');
                parsedData = await fetch('/api/parse-url', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) }).then(r => r.json());
                if (parsedData.error) throw new Error(parsedData.error);
                document.getElementById('addName').value = parsedData.name || '';
                document.getElementById('addNameEn').value = parsedData.nameEn || parsedData.name || '';
                document.getElementById('addSummary').value = parsedData.summary || '';
                document.getElementById('addTags').value = (parsedData.github?.topics || []).join(', ');
                showToast('解析成功');
            } catch (e) { showToast(e.message, true); }
        }

        async function submitItem() {
            const id = document.getElementById('editId').value;
            const data = {
                url: document.getElementById('addUrl').value,
                name: document.getElementById('addName').value,
                nameEn: document.getElementById('addNameEn').value,
                summary: document.getElementById('addSummary').value,
                description: document.getElementById('addDescription').value,
                category: document.getElementById('addCategory').value,
                tags: document.getElementById('addTags').value.split(/[,，]/).map(t => t.trim().toLowerCase()).filter(Boolean),
                imageUrls: document.getElementById('addImages').value.split('\n').map(s => s.trim()).filter(Boolean),
                notes: document.getElementById('addNotes').value,
                archived: document.getElementById('addArchived').checked,
                type: parsedData?.type || editingItem?.type || 'repo',
                github: parsedData?.github || editingItem?.github,
                homepage: parsedData?.homepage || editingItem?.homepage
            };

            if (!data.name) return showToast('请填写名称', true);
            if (!data.summary) return showToast('请填写简介', true);

            // 分离 data URL 和普通 URL：data URL 需要转为文件上传
            const normalUrls = [];
            const dataUrlFiles = [];
            for (const url of data.imageUrls) {
                if (url.startsWith('data:')) {
                    const resp = await fetch(url);
                    const blob = await resp.blob();
                    dataUrlFiles.push(new File([blob], `screenshot-${Date.now()}.png`, { type: 'image/png' }));
                } else {
                    normalUrls.push(url);
                }
            }
            data.imageUrls = normalUrls;

            const formData = new FormData();
            formData.append('data', JSON.stringify(editMode ? { ...data, images: editingItem?.images } : data));
            // 使用 selectedFiles 数组而不是 input.files
            for (const f of selectedFiles) formData.append('files', f);
            for (const f of dataUrlFiles) formData.append('files', f);

            try {
                showToast(editMode ? '正在保存...' : '正在添加...');
                const url = editMode ? `/api/items/${id}` : '/api/items';
                const method = editMode ? 'PUT' : 'POST';
                const res = await fetch(url, { method, body: formData }).then(r => r.json());
                if (res.error) throw new Error(res.error);
                const fileCount = selectedFiles.length;
                const urlCount = data.imageUrls.length;
                const imgMsg = (fileCount + urlCount) > 0 ? `，已处理 ${fileCount + urlCount} 张图片` : '';
                showToast((editMode ? '保存成功！' : '添加成功！') + imgMsg);
                clearForm();
                await reloadCollections();
                renderList();
            } catch (e) { showToast(e.message, true); }
        }

        async function refetchContent() {
            if (!editingItem) return;
            try {
                showToast('正在重新抓取原文内容...');
                const res = await fetch(`/api/items/${editingItem.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refetchContent: true })
                }).then(r => r.json());
                if (res.error) throw new Error(res.error);
                showToast('原文内容已更新！');
            } catch (e) { showToast(e.message, true); }
        }

        function clearForm() {
            editMode = false;
            editingItem = null;
            parsedData = null;
            selectedFiles = [];
            document.getElementById('editId').value = '';
            ['addUrl', 'addName', 'addNameEn', 'addSummary', 'addDescription', 'addTags', 'addImages', 'addNotes'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('addFiles').value = '';
            document.getElementById('addArchived').checked = false;
            document.getElementById('currentImages').innerHTML = '';
            document.getElementById('uploadPreview').innerHTML = '';
            document.getElementById('formTitleText').textContent = '添加新收藏';
            document.getElementById('modeBadge').textContent = '新增模式';
            document.getElementById('modeBadge').classList.remove('edit');
            document.getElementById('submitBtn').textContent = '添加收藏';
            document.getElementById('refetchBtn').style.display = 'none';
        }

        async function toggleArchive(id, archived) {
            try {
                const res = await fetch(`/api/items/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ archived })
                });
                const result = await res.json();
                if (result.error) throw new Error(result.error);

                // 重新获取数据
                await reloadCollections();
                renderList();
                showToast(archived ? '已归档' : '已取消归档');
            } catch (e) {
                showToast('操作失败: ' + e.message, true);
            }
        }

        async function deleteItem(id) {
            if (!confirm('确定要删除吗？此操作不可恢复！')) return;
            try {
                const res = await fetch(`/api/items/${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.error) throw new Error(result.error);

                // 重新获取数据
                await reloadCollections();
                renderList();
                showToast('已删除');

                // 如果正在编辑这个项目，清空表单
                if (editMode && editingItem?.id === id) clearForm();
            } catch (e) {
                showToast('删除失败: ' + e.message, true);
            }
        }

        async function batchUpdate() {
            document.getElementById('batchBtn').disabled = true;
            document.getElementById('batchProgress').style.display = 'block';
            document.getElementById('batchLog').style.display = 'block';
            document.getElementById('batchLog').textContent = '';

            const repoCount = collections.items.filter(i => i.type === 'repo').length;
            const es = new EventSource('/api/batch-update');
            es.onmessage = e => {
                const data = JSON.parse(e.data);
                if (data.type === 'start') {
                    document.getElementById('progressText').textContent = `0 / ${data.total}`;
                } else if (data.type === 'progress') {
                    const pct = (data.current / repoCount) * 100;
                    document.getElementById('progressFill').style.width = pct + '%';
                    document.getElementById('progressText').textContent = `${data.current} / ${repoCount}`;
                    document.getElementById('batchLog').textContent += `${data.success ? '✅' : '❌'} ${data.name}\n`;
                    document.getElementById('batchLog').scrollTop = document.getElementById('batchLog').scrollHeight;
                } else if (data.type === 'done') {
                    es.close();
                    document.getElementById('batchBtn').disabled = false;
                    showToast('批量更新完成');
                    init();
                } else if (data.type === 'error') {
                    es.close();
                    document.getElementById('batchBtn').disabled = false;
                    showToast(data.message, true);
                }
            };
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => t.className = 'toast', 3000);
        }

        // ===== 图片选择弹窗 =====
        async function openImagePicker() {
            const url = document.getElementById('addUrl').value.trim();
            if (!url) return showToast('请先输入 URL', true);

            pickerSelectedUrls = new Set();
            const modal = document.getElementById('imagePickerModal');
            const body = document.getElementById('imagePickerBody');
            modal.classList.add('show');
            body.innerHTML = '<div class="image-picker-loading">正在获取网页图片...</div>';
            updateSelectedCount();

            try {
                const res = await fetch('/api/fetch-page-images', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await res.json();
                const images = data.images || [];

                if (images.length > 0) {
                    renderPickerImages(images, body);
                } else {
                    // 没有图片，尝试渲染 README 作为截图
                    body.innerHTML = '<div class="image-picker-empty">未从网页中找到图片，正在生成 README 预览截图...</div>';
                    await generateReadmeScreenshot(url, body);
                }
            } catch (e) {
                body.innerHTML = `<div class="image-picker-empty">获取图片失败: ${e.message}</div>`;
            }
        }

        function renderPickerImages(images, container) {
            container.innerHTML = `
                <div class="image-grid">
                    ${images.map((src, i) => `
                        <div class="image-grid-item" data-url="${src.replace(/"/g, '&quot;')}" onclick="togglePickerImage(this)">
                            <img src="${src}" alt="图片${i + 1}" loading="lazy" onerror="this.parentElement.style.display='none'">
                            <div class="img-label" title="${src}">${decodeURIComponent(src.split('/').pop().split('?')[0]).slice(0, 30)}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function togglePickerImage(el) {
            const url = el.dataset.url;
            if (pickerSelectedUrls.has(url)) {
                pickerSelectedUrls.delete(url);
                el.classList.remove('selected');
            } else {
                pickerSelectedUrls.add(url);
                el.classList.add('selected');
            }
            updateSelectedCount();
        }

        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = `已选择 ${pickerSelectedUrls.size} 张`;
        }

        function closeImagePicker() {
            document.getElementById('imagePickerModal').classList.remove('show');
            pickerSelectedUrls.clear();
        }

        function confirmImagePicker() {
            if (pickerSelectedUrls.size > 0) {
                const textarea = document.getElementById('addImages');
                const existing = textarea.value.trim();
                const newUrls = Array.from(pickerSelectedUrls).join('\n');
                textarea.value = existing ? existing + '\n' + newUrls : newUrls;
                showToast(`已添加 ${pickerSelectedUrls.size} 张图片`);
            }
            document.getElementById('imagePickerModal').classList.remove('show');
            pickerSelectedUrls.clear();
        }

        async function generateReadmeScreenshot(url, container) {
            try {
                // 获取 README 内容
                const res = await fetch('/api/fetch-content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, type: parsedData?.type || 'repo' })
                });
                const data = await res.json();

                if (!data.content) {
                    container.innerHTML = '<div class="image-picker-empty">无法获取内容，请手动添加图片</div>';
                    return;
                }

                // 创建隐藏的渲染区域
                const renderDiv = document.createElement('div');
                renderDiv.className = 'readme-render-area';
                renderDiv.style.position = 'fixed';
                renderDiv.style.left = '-9999px';
                renderDiv.style.top = '0';
                renderDiv.style.width = '800px';
                renderDiv.style.maxHeight = 'none';
                renderDiv.style.overflow = 'visible';
                renderDiv.innerHTML = data.content;
                document.body.appendChild(renderDiv);

                // 等待图片加载
                const imgs = renderDiv.querySelectorAll('img');
                await Promise.allSettled(Array.from(imgs).map(img =>
                    img.complete ? Promise.resolve() : new Promise(resolve => {
                        img.onload = resolve;
                        img.onerror = () => { img.style.display = 'none'; resolve(); };
                        setTimeout(resolve, 3000);
                    })
                ));

                // 使用 html2canvas 截图
                const canvas = await html2canvas(renderDiv, {
                    width: 800,
                    height: Math.min(renderDiv.scrollHeight, 600),
                    windowWidth: 800,
                    windowHeight: 600,
                    useCORS: true,
                    allowTaint: true,
                    logging: false,
                    y: 0,
                    scrollY: 0,
                });

                document.body.removeChild(renderDiv);

                // 裁剪顶部 400px 高度
                const cropCanvas = document.createElement('canvas');
                cropCanvas.width = 800;
                cropCanvas.height = Math.min(400, canvas.height);
                const ctx = cropCanvas.getContext('2d');
                ctx.drawImage(canvas, 0, 0, 800, cropCanvas.height, 0, 0, 800, cropCanvas.height);

                const dataUrl = cropCanvas.toDataURL('image/png');

                // 显示截图供选择
                container.innerHTML = `
                    <p class="readme-preview-label">未找到网页图片。以下是从 README 内容生成的预览截图，点击选择：</p>
                    <div class="image-grid">
                        <div class="image-grid-item" data-url="${dataUrl}" onclick="togglePickerImage(this)" style="grid-column: span 2;">
                            <img src="${dataUrl}" alt="README 预览" style="height:auto;max-height:300px;object-fit:contain;">
                            <div class="img-label">README 内容截图</div>
                        </div>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = `<div class="image-picker-empty">生成预览截图失败: ${e.message}，请手动添加图片</div>`;
            }
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
            };
        });
        document.getElementById('listSearch').oninput = renderList;
        document.getElementById('showArchived').onchange = renderList;
        init();
    </script>
</body>

</html>
